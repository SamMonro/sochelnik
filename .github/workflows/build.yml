name: build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: sochelnik-windows
          - os: macos-latest
            name: sochelnik-macos-arm
          - os: macos-13
            name: sochelnik-macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --name ${{ matrix.name }} sochelnik.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}*
